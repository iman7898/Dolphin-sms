<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ارسال به کانال</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="icon" type="image/png" href="/static/icons/icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;color:#e2e8f0;min-height:100vh;
  padding-bottom:130px;direction:rtl;
  background:linear-gradient(180deg,#0c2b4a,#0f3f5f 40%,#051f33)}
.back-bar{display:flex;align-items:center;gap:12px;padding:16px;
  background:linear-gradient(135deg,rgba(0,40,80,.9),rgba(0,80,130,.6));
  border-bottom:1.5px solid rgba(150,210,240,.4);position:sticky;top:0;z-index:100;
  backdrop-filter:blur(15px)}
.back-btn{width:42px;height:42px;border-radius:12px;background:rgba(93,184,232,.2);
  border:1.5px solid rgba(144,224,239,.5);display:flex;align-items:center;
  justify-content:center;color:#90e0ef;text-decoration:none;font-size:20px;font-weight:900}
.page-title{font-size:18px;font-weight:900;color:#e0f4ff;flex:1;text-align:center;
  margin-left:-42px;text-shadow:0 0 12px rgba(144,224,239,.6)}
.container{padding:14px;max-width:600px;margin:0 auto}
.card{background:linear-gradient(135deg,rgba(0,50,90,.65),rgba(0,30,60,.45));
  border:1.5px solid rgba(150,210,240,.4);border-radius:20px;padding:18px;
  backdrop-filter:blur(15px);margin-bottom:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08)}
.card-title{font-size:14px;font-weight:900;color:#90e0ef;margin-bottom:14px;
  padding-bottom:10px;border-bottom:1px dashed rgba(144,224,239,.3);text-align:center}
label{display:block;font-size:12.5px;color:#90e0ef;font-weight:800;margin-bottom:6px}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;
  background:rgba(0,30,60,.6);color:#e0f4ff;
  border:1.5px solid rgba(93,184,232,.4);font-family:Vazirmatn,sans-serif;
  font-size:13.5px;margin-bottom:12px;transition:.3s}
textarea{min-height:100px;resize:vertical;line-height:1.7;direction:rtl;text-align:right}
input:focus,textarea:focus{outline:none;border-color:#5db8e8;
  box-shadow:0 0 20px rgba(93,184,232,.5)}
.btn{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;
  font-family:Vazirmatn,sans-serif;font-size:15px;font-weight:900;
  background:linear-gradient(135deg,#5db8e8,#0077b6);color:#fff;
  box-shadow:0 0 25px rgba(93,184,232,.6);transition:.3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 35px rgba(93,184,232,.9)}
.btn.green{background:linear-gradient(135deg,#06d6a0,#0077b6);
  box-shadow:0 0 25px rgba(6,214,160,.6)}

/* ۳ دکمه اصلی */
.action-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.act-btn{flex:1;min-width:90px;padding:11px;border-radius:12px;border:1.5px solid;
  cursor:pointer;font-family:Vazirmatn;font-size:12px;font-weight:900;
  background:rgba(0,30,60,.5);transition:.3s;display:flex;
  align-items:center;justify-content:center;gap:6px}
.act-ai{color:#c77dff;border-color:#c77dff}
.act-ai:hover{background:rgba(199,125,255,.15);box-shadow:0 0 15px rgba(199,125,255,.5)}
.act-emoji{color:#ffd60a;border-color:#ffd60a}
.act-emoji:hover{background:rgba(255,214,10,.15);box-shadow:0 0 15px rgba(255,214,10,.5)}
.act-img{color:#06d6a0;border-color:#06d6a0}
.act-img:hover{background:rgba(6,214,160,.15);box-shadow:0 0 15px rgba(6,214,160,.5)}

/* 🟢 ۳ گزینه جدید که زیر دکمه‌ها باز میشه */
.photo-menu{display:none;gap:8px;margin-bottom:12px;animation:slideDown .3s ease-out}
.photo-menu.show{display:flex}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.pm-btn{flex:1;padding:10px 4px;border-radius:12px;border:1.5px solid;
  cursor:pointer;font-family:Vazirmatn;font-size:11.5px;font-weight:900;
  background:rgba(0,30,60,.4);transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.pm-btn .ic{font-size:18px}
.pm-upload{color:#06d6a0;border-color:rgba(6,214,160,.4)}
.pm-upload:hover{background:rgba(6,214,160,.15)}
.pm-create{color:#c77dff;border-color:rgba(199,125,255,.4)}
.pm-create:hover{background:rgba(199,125,255,.15)}
.pm-edit{color:#ffd60a;border-color:rgba(255,214,10,.4)}
.pm-edit:hover{background:rgba(255,214,10,.15)}

/* پیش‌نمایش عکس */
.preview{display:none;margin-bottom:10px;position:relative;
  border-radius:12px;overflow:hidden;border:1.5px solid rgba(93,184,232,.4);cursor:pointer}
.preview img{width:100%;display:block;max-height:250px;object-fit:cover}
.preview-rm{position:absolute;top:8px;left:8px;width:32px;height:32px;
  border-radius:50%;background:rgba(255,60,100,.9);color:#fff;border:none;
  font-size:18px;font-weight:900;cursor:pointer;z-index:10}

.msg{padding:12px;border-radius:12px;margin-bottom:12px;text-align:center;
  font-size:13px;font-weight:900}
.msg.ok{background:rgba(6,214,160,.15);border:1.5px solid #06d6a0;color:#06d6a0}
.msg.error{background:rgba(255,107,157,.15);border:1.5px solid #ff6b9d;color:#ff8fab}

.ch-item{display:flex;justify-content:space-between;align-items:center;
  padding:12px;background:rgba(0,30,60,.5);border-radius:12px;margin-bottom:8px;
  border:1px solid rgba(93,184,232,.3)}
.ch-id{font-size:13px;font-weight:900;color:#90e0ef;font-family:monospace}
.ch-del{padding:8px 12px;border-radius:8px;background:rgba(255,107,157,.15);
  border:1px solid rgba(255,107,157,.5);color:#ff8fab;font-family:Vazirmatn;
  font-size:11px;font-weight:900;cursor:pointer}
.empty{text-align:center;padding:30px;color:#7a9cb5;font-size:12.5px}

/* 🌟 مودال هوش مصنوعی */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
  backdrop-filter:blur(8px);z-index:10000;align-items:center;justify-content:center;padding:20px}
.modal{background:linear-gradient(135deg,#0f3f5f,#0c2b4a);width:100%;max-width:420px;
  border-radius:20px;padding:20px;border:1.5px solid rgba(150,210,240,.4);
  box-shadow:0 0 50px rgba(0,0,0,.5)}
.modal-title{font-size:16px;font-weight:900;color:#90e0ef;text-align:center;margin-bottom:6px}
.modal-sub{font-size:11px;color:#a8c8e0;text-align:center;margin-bottom:16px}

.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.preset-chip{padding:6px 12px;border-radius:20px;background:rgba(93,184,232,.15);
  border:1px solid rgba(93,184,232,.4);color:#e0f4ff;font-family:Vazirmatn;
  font-size:11px;cursor:pointer;transition:.2s}
.preset-chip:hover{background:rgba(93,184,232,.3);border-color:#5db8e8}

.modal textarea{min-height:80px;margin-bottom:12px}
.modal-actions{display:flex;gap:10px}
.btn-cancel{background:rgba(150,210,240,.1);color:#a8c8e0;border:1.5px solid rgba(150,210,240,.3)}
.loading-img{display:none;text-align:center;padding:20px;color:#90e0ef}
.spin{display:inline-block;width:32px;height:32px;border:3px solid rgba(144,224,239,.2);
  border-top-color:#90e0ef;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* 🌟 توست (پیام شیک) */
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:linear-gradient(135deg,#ff6b9d,#c9184a);color:#fff;padding:12px 24px;
  border-radius:12px;font-weight:bold;font-size:13px;z-index:99999;
  box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .3s;}
#toast.show{transform:translateX(-50%) translateY(0);}
</style></head><body>

<div id="toast"></div>

<div class="back-bar">
  <a href="/panel/dashboard" class="back-btn">→</a>
  <div class="page-title">📢 ارسال به کانال</div>
</div>

<div class="container">
  {% if msg %}
  <div class="msg {{ msg[0] }}">{{ msg[1] }}</div>
  {% endif %}

  <div class="card">
    <div class="card-title">📝 نوشتن پست</div>
    <form method="POST" action="/panel/channel-send" enctype="multipart/form-data" id="mainForm">
      <input type="hidden" name="action" value="send">

      <label>📢 کانال مقصد</label>
      <select name="target_channel" required>
        <option value="">-- انتخاب کانال --</option>
        {% for ch in channels %}
        <option value="{{ ch[1] }}">{{ ch[1] }}{% if ch[2] %} ({{ ch[2] }}){% endif %}</option>
        {% endfor %}
      </select>

      <!-- ۳ دکمه اصلی -->
      <div class="action-bar">
        <button type="button" class="act-btn act-ai" onclick="aiEnhance()">🤖 قوی‌سازی متن</button>
        <button type="button" class="act-btn act-emoji" onclick="emojiSuggest()">🎨 ایموجی</button>
        <button type="button" class="act-btn act-img" onclick="togglePhotoMenu()">📷 عکس</button>
      </div>

      <!-- ۳ گزینه که زیر دکمه عکس باز میشه -->
      <div class="photo-menu" id="photoMenu">
        <button type="button" class="pm-btn pm-upload" onclick="document.getElementById('imgInput').click()">
          <span class="ic">📁</span> آپلود از گوشی
        </button>
        <button type="button" class="pm-btn pm-create" onclick="openModal('create')">
          <span class="ic">🎨</span> ساخت با AI
        </button>
        <button type="button" class="pm-btn pm-edit" onclick="openModal('edit')">
          <span class="ic">✨</span> تغییر با AI
        </button>
      </div>
      
      <input type="file" id="imgInput" name="image_file" accept="image/*" style="display:none" onchange="showPreview(this)">

      <div class="preview" id="previewBox" onclick="togglePhotoMenu()">
        <img id="previewImg" src="" alt="برای تغییر کلیک کنید">
        <button type="button" class="preview-rm" onclick="event.stopPropagation(); rmImg();">✕</button>
      </div>

      <label>💬 متن پیام</label>
      <textarea name="text" id="textInput" placeholder="متن پیام خود را بنویسید..." required></textarea>

      <label>🏷 تگ (اختیاری)</label>
      <input type="text" name="tag" placeholder="@dolphin_shop">

      <button type="submit" class="btn green">📤 ارسال به کانال</button>
    </form>
  </div>

  <div class="card">
    <div class="card-title">➕ افزودن کانال جدید</div>
    <form method="POST" action="/panel/channel-send">
      <input type="hidden" name="action" value="add_channel">
      <label>📢 آیدی کانال</label>
      <input type="text" name="channel_id" placeholder="@my_channel" required>
      <button type="submit" class="btn">➕ افزودن</button>
    </form>
  </div>
</div>

<!-- 🌟 مودال هوش مصنوعی -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-title" id="modalTitle">ساخت عکس</div>
    <div class="modal-sub" id="modalSub">توصیف کن چه عکسی می‌خوای (انگلیسی بهتره)</div>
    
    <div class="presets">
      <div class="preset-chip" onclick="setPrompt('A cozy modern cafe interior, warm lighting, coffee cups')">☕ کافه</div>
      <div class="preset-chip" onclick="setPrompt('Fresh colorful fruits on wooden shelves in a shop')">🍎 میوه‌فروشی</div>
      <div class="preset-chip" onclick="setPrompt('A modern clothing boutique with stylish mannequins')">👕 پوشاک</div>
      <div class="preset-chip" onclick="setPrompt('A luxury sports car in a dark showroom, cinematic')">🚗 ماشین</div>
    </div>

    <div id="modalBody">
      <textarea id="aiPrompt" placeholder="مثلا: A beautiful modern room..."></textarea>
      <div class="loading-img" id="aiLoading">
        <div class="spin"></div>
        <div style="margin-top:10px">در حال ساخت عکس...</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeModal()">انصراف</button>
        <button class="btn green" id="aiSubmitBtn" onclick="generateAIImage()">✨ ساخت عکس</button>
      </div>
    </div>
  </div>
</div>

<script>
// --- توست شیک ---
function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// --- باز و بسته کردن منوی عکس ---
function togglePhotoMenu() {
  var menu = document.getElementById('photoMenu');
  menu.classList.toggle('show');
}

// --- AI متن ---
function aiEnhance() {
  var t = document.getElementById('textInput').value.trim();
  if (!t) { showToast('اول متن رو توی کادر بنویس'); return; }
  var btn = document.querySelector('.act-ai');
  var old = btn.innerHTML;
  btn.innerHTML = '⏳...';
  fetch('/panel/channel-send/ai', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: t})
  }).then(r => r.json()).then(d => {
    btn.innerHTML = old;
    if (d.result) document.getElementById('textInput').value = d.result;
    else showToast('خطا در قوی‌سازی');
  }).catch(e => { btn.innerHTML = old; showToast('خطای شبکه'); });
}

// --- ایموجی ---
function emojiSuggest() {
  var t = document.getElementById('textInput').value.trim();
  if (!t) { showToast('اول متن رو بنویس'); return; }
  var word = t.split(' ')[0];
  var btn = document.querySelector('.act-emoji');
  var old = btn.innerHTML;
  btn.innerHTML = '⏳...';
  fetch('/panel/channel-send/emoji', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({word: word})
  }).then(r => r.json()).then(d => {
    btn.innerHTML = old;
    if (d.emoji) {
      var ta = document.getElementById('textInput');
      ta.value = d.emoji + ' ' + ta.value;
    }
  }).catch(e => { btn.innerHTML = old; });
}

// --- پیش‌نمایش ---
function showPreview(inp) {
  if (inp.files && inp.files[0]) {
    var url = URL.createObjectURL(inp.files[0]);
    document.getElementById('previewImg').src = url;
    document.getElementById('previewBox').style.display = 'block';
  }
}
function rmImg() {
  document.getElementById('imgInput').value = '';
  document.getElementById('previewBox').style.display = 'none';
}

// --- هوش مصنوعی عکس ---
let currentMode = 'create';
function openModal(mode) {
  document.getElementById('photoMenu').classList.remove('show'); // بستن منوی عکس
  currentMode = mode;
  document.getElementById('modalBg').style.display = 'flex';
  document.getElementById('aiLoading').style.display = 'none';
  document.getElementById('aiSubmitBtn').style.display = 'block';
  document.getElementById('aiPrompt').value = '';
  
  if (mode === 'create') {
    document.getElementById('modalTitle').innerText = '🎨 ساخت عکس جدید';
    document.getElementById('modalSub').innerText = 'توصیف کن چه عکسی می‌خوای یا از دکمه‌های بالا انتخاب کن';
    document.getElementById('aiSubmitBtn').innerText = '✨ ساخت عکس';
  } else {
    document.getElementById('modalTitle').innerText = '✨ تغییر عکس';
    document.getElementById('modalSub').innerText = 'چه تغییری در عکس آپلود شده می‌خوای؟';
    document.getElementById('aiSubmitBtn').innerText = '✨ اعمال تغییرات';
    var imgInput = document.getElementById('imgInput');
    if (!imgInput.files || imgInput.files.length === 0) {
      showToast('اول باید یه عکس از گوشی انتخاب کنی!');
      imgInput.click();
      closeModal();
    }
  }
}
function closeModal(){ document.getElementById('modalBg').style.display = 'none'; }
function setPrompt(txt) { document.getElementById('aiPrompt').value = txt; }

function generateAIImage() {
  var prompt = document.getElementById('aiPrompt').value.trim();
  if (!prompt) { showToast('لطفا یه توضیحی بنویس'); return; }
  
  document.getElementById('aiLoading').style.display = 'block';
  document.getElementById('aiSubmitBtn').style.display = 'none';
  
  var fetchOptions = {};
  var endpoint = '/panel/channel-send/ai-image';
  
  if (currentMode === 'edit') {
    endpoint = '/panel/channel-send/edit-image';
    var formData = new FormData();
    formData.append('prompt', prompt);
    formData.append('image', document.getElementById('imgInput').files[0]);
    fetchOptions = { method: 'POST', body: formData };
  } else {
    fetchOptions = {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ prompt: prompt })
    };
  }

  fetch(endpoint, fetchOptions)
  .then(async r => {
    const text = await r.text();
    try { return JSON.parse(text); } catch(e) { throw new Error('پاسخ نامعتبر'); }
  })
  .then(d => {
    document.getElementById('aiLoading').style.display = 'none';
    document.getElementById('aiSubmitBtn').style.display = 'block';
    
    if (d.url) {
      fetch(d.url)
        .then(res => res.blob())
        .then(blob => {
          var file = new File([blob], "ai_generated.jpg", { type: "image/jpeg" });
          var dt = new DataTransfer();
          dt.items.add(file);
          document.getElementById('imgInput').files = dt.files;
          
          document.getElementById('previewImg').src = d.url;
          document.getElementById('previewBox').style.display = 'block';
          closeModal();
          showToast('✅ عکس با موفقیت ساخته شد');
        });
    } else {
      showToast('خطا: ' + (d.error || 'مشکل در پردازش'));
    }
  })
  .catch(e => {
    document.getElementById('aiLoading').style.display = 'none';
    document.getElementById('aiSubmitBtn').style.display = 'block';
    showToast('خطای شبکه: ' + e.message);
  });
}
</script>

</body></html>
