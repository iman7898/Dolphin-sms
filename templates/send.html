<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ارسال پیامک</title>
    <link rel="stylesheet" href="/static/style.css">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>body,input,textarea,button,select{font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif !important;}</style>
<script src="/static/custom-alert.js"></script>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#00ff9d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="پنل پیامکی">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('/static/service-worker.js').catch(function(){});
    });
}
</script>
<link rel="icon" type="image/png" href="/static/icons/icon-192.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"></head>
<body class="matrix-bg">
    <div class="container">

        <div class="header-bar">
            <div class="header-title">✉ ارسال پیامک</div>
        </div>

        {% if result %}
            <div class="{{ 'success' if result.status == 'success' else 'error' }}">
                {% if result.status == 'success' %}
                    ✅ پیامک با موفقیت ثبت شد
                {% else %}
                    ❌ {{ result.message }}
                {% endif %}
            </div>
        {% endif %}

        <div class="send-form-box">
            <form method="post">
                <label class="form-label">شماره گیرنده</label>
                <input type="text" name="phone" placeholder="09123456789" required inputmode="numeric">

                <label class="form-label">متن پیامک</label>
                <textarea name="message" placeholder="متن پیامک را بنویسید..." required></textarea>

                <button type="submit" class="btn-white">✉ ارسال</button>
            </form>
        </div>

        <div class="footer-box">
            <div class="footer-actions">
                <a href="/dashboard" class="btn-nav">← بازگشت به داشبورد</a>
            </div>
        </div>

    </div>
{% include "_global_bg.html" %}

<!-- زنگوله اعلان‌ها -->
<a href="#" id="notifBellLink" class="notif-bell" title="اعلان‌ها">
🔔
<span class="notif-badge-bell" id="notifBadge" style="display:none;">0</span>
</a>
<script>
(function() {
    if (window.__notif_loaded) return;
    window.__notif_loaded = true;
    function updateNotifCount() {
        fetch('/api/notif/count').then(function(r) { return r.json(); }).then(function(data) {
            var badge = document.getElementById('notifBadge');
            if (!badge) return;
            if (data.count > 0) {
                badge.textContent = data.count > 99 ? '99+' : data.count;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }).catch(function() {});
    }
    updateNotifCount();
    setInterval(updateNotifCount, 30000);
})();
</script>


<script>
(function() {
    var bell = document.getElementById('notifBellLink');
    if (bell) {
        if (window.location.pathname.indexOf('/admin/') === 0) {
            bell.href = '/admin/notifications';
        } else {
            bell.href = '/notifications';
        }
    }
})();
</script>

</body>
</html>
