<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ category }}</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{font-family:Vazirmatn,Tahoma,sans-serif;color:#e2e8f0;min-height:100vh;padding:74px 14px 130px;margin:0;background:#020a08;background-image:radial-gradient(circle at 15% 0%,rgba(255,215,0,.14),transparent 45%),radial-gradient(circle at 85% 100%,rgba(0,212,255,.14),transparent 45%)}
.back-btn{position:fixed;top:18px;right:18px;background:rgba(0,255,157,.1);color:#00ff9d;border:1px solid #00ff9d;border-radius:10px;padding:7px 14px;font-size:12px;text-decoration:none;z-index:20}
.frame{border:2px solid #00ff9d;border-radius:26px;padding:18px 14px;background:rgba(0,20,15,.35)}
.pt{text-align:center;font-size:20px;font-weight:900;color:#ffd700;margin:0 0 16px;text-shadow:0 0 14px rgba(255,215,0,.8)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prod{background:linear-gradient(135deg,rgba(0,20,15,.9),rgba(0,10,8,.9));border:1.5px solid rgba(255,215,0,.3);border-radius:16px;padding:14px;text-align:center;animation:pIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.prod-ic{font-size:36px;display:block;margin-bottom:8px}
.prod-n{font-size:13.5px;font-weight:bold;color:#ffd700;margin-bottom:4px}
.prod-d{font-size:10.5px;color:#ffe9a8;margin-bottom:6px;opacity:.85}
.prod-p{font-size:16px;font-weight:900;color:#00ff9d;direction:ltr}
.empty{text-align:center;color:#6b8f80;padding:40px 0}
.nw{position:fixed;bottom:14px;left:14px;right:14px;height:76px;padding:2px;border-radius:40px;background:linear-gradient(90deg,#00ff9d,#00d4ff 35%,#bf00ff 70%,#00ff9d);z-index:100}
.bn2{height:100%;border-radius:38px;background:linear-gradient(180deg,#0a1f1a,#04120e);display:flex;align-items:center;justify-content:space-around;padding:0 6px}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#9aa8b2;text-decoration:none;font-size:10.5px;padding:8px 4px}
.ni .ic{font-size:22px;filter:grayscale(1) brightness(.85)}
.ni.act{background:linear-gradient(135deg,rgba(0,255,157,.15),rgba(0,200,140,.06));border-radius:20px}
.ni.act .ic{filter:none;color:#00ff9d}.ni.act span:last-child{color:#00ff9d;font-weight:bold}
</style><link rel="icon" type="image/png" href="/static/icons/icon-192.png"><link rel="apple-touch-icon" href="/static/apple-touch-icon.png"><link rel="stylesheet" href="/static/customer-ocean.css"></head><body>
<a class="back-btn" href="/customer/home">→ خانه</a>
<div class="frame">
<div class="pt">📂 {{ category }}</div>
{% if products %}
<div class="grid">
{% for p in products %}
<div class="prod" style="animation-delay:{{ loop.index0 * 0.05 }}s">
<span class="prod-ic">📦</span>
<div class="prod-n">{{ p[1] }}</div>
{% if p[4] %}<div class="prod-d">{{ p[4] }}</div>{% endif %}
<div class="prod-p">{{ "{:,}".format(p[2]) }} ت</div>
</div>
{% endfor %}
</div>
{% else %}
<div class="empty">📭 محصولی در این دسته نیست</div>
{% endif %}
</div>
<div class="nw"><div class="bn2">
<a class="ni" href="/customer/home"><span class="ic">🏠</span><span>خانه</span></a>
<a class="ni" href="/customer/search"><span class="ic">🔍</span><span>جستجو</span></a>
<a class="ni" href="/customer/cart/list"><span class="ic">🛒</span><span>سبد</span></a>
<a class="ni" href="/customer/profile"><span class="ic">👤</span><span>پروفایل</span></a>
</div></div>
{% include "_global_bg.html" %}



</body></html>
