<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>هوش مصنوعی ادمین</title>
    <link rel="stylesheet" href="/static/style.css">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>body,input,textarea,button,select{font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif !important;}</style>
<script src="/static/custom-alert.js"></script>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#00ff9d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="پنل پیامکی">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('/static/service-worker.js').catch(function(){});
    });
}
</script>
</head>
<body class="matrix-bg admin-view">
<div class="container">
    <div class="header-bar red-header">
        <div class="header-title red-title">🤖 دستیار هوشمند ادمین</div>
    </div>

    <div class="ai-status">
        <div class="ai-status-item">
            <span class="ai-label">وضعیت</span>
            <span class="ai-value premium">⭐ نامحدود</span>
        </div>
    </div>

    <div class="ai-chat-box" id="aiChatBox">
        <div class="chat-msg from-admin">
            <div class="chat-bubble">
                <div class="chat-text">سلام ادمین عزیز! هر سوالی داری بپرس 🤖</div>
            </div>
        </div>
    </div>

    <form class="chat-form" id="aiForm">
        <input type="text" id="aiInput" placeholder="سوالت رو بنویس..." autocomplete="off">
        <button type="submit" class="chat-send">➤</button>
    </form>
</div>

<nav class="bottom-nav">
    <a href="/admin/dashboard" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span>
        <span class="nav-label">پنل</span>
    </a>
    <a href="/admin/chat" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-8a8 8 0 0 1 8-8h2a8 8 0 0 1 8 5z"/><circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/></svg></span>
        <span class="nav-label">چت</span>
        {% if unread_chat and unread_chat > 0 %}<span class="nav-badge">{{ unread_chat }}</span>{% endif %}
    </a>
    <a href="/admin/ai" class="nav-item active">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="3"/><circle cx="9" cy="14" r="1.5" fill="currentColor" stroke="none"/><circle cx="15" cy="14" r="1.5" fill="currentColor" stroke="none"/><path d="M12 3v5"/><circle cx="12" cy="3" r="1"/></svg></span>
        <span class="nav-label">هوش مصنوعی</span>
    </a>
    <a href="/admin/profile" class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></span>
        <span class="nav-label">پروفایل</span>
    </a>
</nav>

<script>
    const form = document.getElementById('aiForm');
    const input = document.getElementById('aiInput');
    const box = document.getElementById('aiChatBox');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const q = input.value.trim();
        if (!q) return;
        addBubble(q, 'shopkeeper');
        input.value = '';
        const loadingId = addBubble('...', 'admin');
        try {
            const r = await fetch('/admin/ai/ask', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({q: q})
            });
            const data = await r.json();
            const el = document.getElementById(loadingId);
            el.querySelector('.chat-text').textContent = data.answer || data.message;
        } catch (err) {
            const el = document.getElementById(loadingId);
            el.querySelector('.chat-text').textContent = 'خطا در اتصال';
        }
    });

    let bubbleId = 0;
    function addBubble(text, who) {
        bubbleId++;
        const id = 'bubble-' + bubbleId;
        const div = document.createElement('div');
        div.className = 'chat-msg ' + (who === 'admin' ? 'from-admin' : 'from-shop');
        div.innerHTML = `<div class="chat-bubble" id="${id}"><div class="chat-text">${text}</div></div>`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return id;
    }
</script>
{% include "_global_bg.html" %}

<!-- زنگوله اعلان‌ها -->
<a href="#" id="notifBellLink" class="notif-bell" title="اعلان‌ها">
🔔
<span class="notif-badge-bell" id="notifBadge" style="display:none;">0</span>
</a>
<script>
(function() {
    if (window.__notif_loaded) return;
    window.__notif_loaded = true;
    function updateNotifCount() {
        fetch('/api/notif/count').then(function(r) { return r.json(); }).then(function(data) {
            var badge = document.getElementById('notifBadge');
            if (!badge) return;
            if (data.count > 0) {
                badge.textContent = data.count > 99 ? '99+' : data.count;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }).catch(function() {});
    }
    updateNotifCount();
    setInterval(updateNotifCount, 30000);
})();
</script>


<script>
(function() {
    var bell = document.getElementById('notifBellLink');
    if (bell) {
        if (window.location.pathname.indexOf('/admin/') === 0) {
            bell.href = '/admin/notifications';
        } else {
            bell.href = '/notifications';
        }
    }
})();
</script>

</body>
</html>
