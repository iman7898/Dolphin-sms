<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>افزودن محصول | دلفین</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #031526; color: white; padding: 15px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
        
        .main-box { width: 100%; max-width: 500px; background: #06213b; border: 1px solid #1a5276; border-radius: 20px; padding: 20px; box-shadow: 0 0 15px rgba(0,168,255,0.1); margin-top: 10px; }
        .header-title { text-align: center; color: #00d4ff; font-size: 18px; font-weight: bold; margin-bottom: 25px; display: flex; justify-content: center; align-items: center; gap: 10px; }
        
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .grid-btn { background: rgba(0, 0, 0, 0.2); border-radius: 12px; padding: 15px 5px; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.3s; }
        .grid-btn:active { transform: scale(0.95); }
        .grid-btn i { font-size: 24px; font-style: normal; }

        .c-green { border: 1.5px solid #00ff88; color: #00ff88; box-shadow: 0 0 10px rgba(0,255,136,0.1); }
        .c-yellow { border: 1.5px solid #ffd700; color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.1); }
        .c-purple { border: 1.5px solid #b100ff; color: #b100ff; box-shadow: 0 0 10px rgba(177,0,255,0.1); }
        .c-blue { border: 1.5px solid #00d4ff; color: #00d4ff; box-shadow: 0 0 10px rgba(0,212,255,0.1); }
        .c-pink { border: 1.5px solid #ff69b4; color: #ff69b4; box-shadow: 0 0 10px rgba(255,105,180,0.1); }
        .c-teal { border: 1.5px solid #20b2aa; color: #20b2aa; box-shadow: 0 0 10px rgba(32,178,170,0.1); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 10px; color: #fff; font-size: 15px; font-weight: bold; }
        .form-control { width: 100%; background: #031526; border: 1.5px solid #1a5276; color: white; padding: 15px; border-radius: 15px; font-family: Tahoma; font-size: 14px; outline: none; transition: 0.3s; }
        .form-control::placeholder { color: #6688aa; }
        .form-control:focus { border-color: #00d4ff; box-shadow: 0 0 10px rgba(0,212,255,0.2); }
        textarea.form-control { resize: none; min-height: 100px; }

        .submit-btn { width: 100%; background: linear-gradient(90deg, #00b4db, #0083b0); color: white; border: none; padding: 15px; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(0,180,219,0.3); display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
        .submit-btn:active { transform: scale(0.98); }
        #realImageInput { display: none; }
    </style>
</head>
<body>
    
    <div style="color: #6688aa; font-size: 13px; margin-top: 8px; font-family: Tahoma;">فرمت‌های مجاز: JPG, PNG</div>
</div>

        


    </div>









<script>
    document.addEventListener("DOMContentLoaded", function() {
        // مخفی کردن دکمه‌های رنگی قبلی
        document.querySelectorAll('div').forEach(function(d) {
            if (d.innerText && d.innerText.includes('قوی‌سازی متن') && !d.innerText.includes('نام محصول')) {
                d.style.setProperty('display', 'none', 'important');
            }
        });

        let selectedFiles = [];
        let input = document.getElementById('imgInput');
        
        document.getElementById('add-more-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            input.click();
        });

        input.addEventListener('change', function(e) {
            let files = Array.from(e.target.files);
            selectedFiles = selectedFiles.concat(files);
            this.value = '';
            updatePreviews();
        });

        function updatePreviews() {
            let container = document.getElementById('preview-container');
            container.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                let reader = new FileReader();
                reader.onload = function(e) {
                    let div = document.createElement('div');
                    div.style.cssText = 'position: relative; width: 80px; height: 80px;';
                    
                    let img = document.createElement('img');
                    img.src = e.target.result;
                    img.style.cssText = 'width: 100%; height: 100%; object-fit: cover; border-radius: 10px; border: 2px solid #00ff88;';
                    
                    let delBtn = document.createElement('div');
                    delBtn.innerHTML = '&times;';
                    delBtn.style.cssText = 'position: absolute; top: -5px; right: -5px; background: #ff4d4d; color: white; width: 20px; height: 20px; border-radius: 50%; text-align: center; line-height: 20px; font-weight: bold; cursor: pointer; font-size: 14px;';
                    delBtn.onclick = function(e) {
                        e.stopPropagation();
                        selectedFiles.splice(index, 1);
                        updatePreviews();
                    };
                    
                    div.appendChild(img);
                    div.appendChild(delBtn);
                    container.appendChild(div);
                };
                reader.readAsDataURL(file);
            });

            if (selectedFiles.length > 0) {
                document.getElementById('upload-text').style.display = 'none';
                document.getElementById('add-more-btn').style.display = 'block';
            } else {
                document.getElementById('upload-text').style.display = 'block';
                document.getElementById('add-more-btn').style.display = 'none';
            }
        }
    });
</script>


<!-- === FORCED 100% WIDTH FORM === -->

            </div>
            
            <div id="add-more-btn" style="display: none; margin-top: 15px; background: #00ff88; color: #031526; width: 40px; height: 40px; border-radius: 50%; font-size: 26px; font-weight: bold; line-height: 38px; box-shadow: 0 0 15px rgba(0,255,136,0.5); pointer-events: auto; cursor: pointer;">+</div>
        </div>
        
        <input type="file" id="imgInput" name="image" accept="image/*" multiple style="display: none;">
        
        <div style="margin-bottom: 15px; text-align:right; width: 100% !important; box-sizing: border-box !important;">
            <label style="color: white; display:block; margin-bottom:8px; font-family:Tahoma; font-weight:bold;">📦 نام محصول</label>
            <input type="text" name="name" placeholder="مثلاً سیب قرمز" style="width:100% !important; box-sizing: border-box !important; padding:15px; background:#021222; border:1.5px solid #0066ff; border-radius:12px; color:white; font-family:Tahoma; outline:none;" required>
        </div>
        <div style="margin-bottom: 15px; text-align:right; width: 100% !important; box-sizing: border-box !important;">
            <label style="color: white; display:block; margin-bottom:8px; font-family:Tahoma; font-weight:bold;">💰 قیمت (تومان)</label>
            <input type="number" name="price" placeholder="مثلاً ۵۰۰۰۰" style="width:100% !important; box-sizing: border-box !important; padding:15px; background:#021222; border:1.5px solid #0066ff; border-radius:12px; color:white; font-family:Tahoma; outline:none;" required>
        </div>
        <div style="margin-bottom: 15px; text-align:right; width: 100% !important; box-sizing: border-box !important;">
            <label style="color: white; display:block; margin-bottom:8px; font-family:Tahoma; font-weight:bold;">📝 توضیحات</label>
            <textarea name="description" placeholder="توضیح کوتاه درباره محصول..." style="width:100% !important; box-sizing: border-box !important; padding:15px; background:#021222; border:1.5px solid #0066ff; border-radius:12px; color:white; font-family:Tahoma; height:100px; outline:none; resize:none;"></textarea>
        </div>
        <button type="submit" style="width:100% !important; box-sizing: border-box !important; padding:15px; background:linear-gradient(90deg, #00ff88, #00d4ff); color:#021222; border:none; border-radius:15px; font-weight:bold; font-size:16px; font-family:Tahoma; cursor:pointer; box-shadow:0 4px 15px rgba(0,180,219,0.3);">💾 ثبت محصول</button>
    </form>
</div>

<style>
    /* زور زدن عرض 100 درصد به کل فرم و کادرها */
    form[action="/panel/add-product"] { width: 100% !important; display: block !important; padding: 0 !important; }
    form[action="/panel/add-product"] > div { width: 100% !important; display: block !important; box-sizing: border-box !important; }
    #main-upload-box { width: 100% !important; max-width: 100% !important; display: flex !important; }
    
    /* مخفی کردن متن های مزاحم */
    .rogue-text-remove { display: none !important; }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        // پیدا کردن و مخفی کردن متن "فرمت های مجاز" که بیرون از کادر مونده
        let elements = document.querySelectorAll('*');
        elements.forEach(el => {
            if (el.children.length === 0) { // فقط المان های برگ
                let txt = el.innerText || '';
                if (txt.includes('JPG') || txt.includes('PNG') || txt.includes('فرمت‌های مجاز')) {
                    el.classList.add('rogue-text-remove');
                    if(el.parentElement && el.parentElement.innerText.includes('JPG, PNG')) {
                        el.parentElement.classList.add('rogue-text-remove');
                    }
                }
            }
        });

        // زور زدن عرض 100 درصد به کادر آپلود
        let box = document.getElementById('main-upload-box');
        if (box) {
            box.style.setProperty('width', '100%', 'important');
            box.parentElement.style.setProperty('width', '100%', 'important');
        }
    });
</script>

</body>
