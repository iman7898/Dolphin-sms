<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>قالب‌های کاربران</title>
<link rel="stylesheet" href="/static/style.css">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body class="matrix-bg admin-view">
<div class="container">

<div class="header-bar red-header">
<div class="header-title red-title">✉ قالب‌های کاربران</div>
</div>

<h2>📋 لیست مغازه‌دارها</h2>

<div class="contacts-list">
{% for u in users %}
<a href="/admin/templates/{{ u.id }}" class="contact-card" style="text-decoration:none;color:inherit;">
<div class="contact-avatar">{{ (u.shop_name or u.username)[0] }}</div>
<div class="contact-info">
<div class="contact-name">{{ u.shop_name or u.username }}</div>
<div class="contact-phone">@{{ u.username }}</div>
<div class="contact-group" style="background:rgba(255,190,11,0.1);color:#ffbe0b;border-color:rgba(255,190,11,0.4);">
✉ {{ u.templates_count }} قالب
</div>
</div>
<div class="contact-actions">
<span style="font-size:22px;color:#7a8599;">‹</span>
</div>
</a>
{% endfor %}
</div>

<div class="footer-box">
<div class="footer-actions">
<a href="/admin/dashboard" class="btn-nav">← بازگشت به پنل</a>
</div>
</div>

</div>

<nav class="bottom-nav">
<a href="/admin/dashboard" class="nav-item">
<span class="nav-icon">🏠</span><span class="nav-label">پنل</span>
</a>
<a href="/admin/stats" class="nav-item">
<span class="nav-icon">📊</span><span class="nav-label">آمار</span>
</a>
<a href="/admin/contacts" class="nav-item">
<span class="nav-icon">📞</span><span class="nav-label">مخاطبین</span>
</a>
<a href="/admin/templates" class="nav-item active">
<span class="nav-icon">✉</span><span class="nav-label">قالب‌ها</span>
</a>
<a href="/admin/chat" class="nav-item">
<span class="nav-icon">💬</span><span class="nav-label">چت</span>
</a>
<a href="/admin/profile" class="nav-item">
<span class="nav-icon">👤</span><span class="nav-label">پروفایل</span>
</a>
</nav>


<!-- زنگوله اعلان‌ها -->
<a href="#" id="notifBellLink" class="notif-bell" title="اعلان‌ها">
🔔
<span class="notif-badge-bell" id="notifBadge" style="display:none;">0</span>
</a>
<script>
(function() {
    if (window.__notif_loaded) return;
    window.__notif_loaded = true;
    function updateNotifCount() {
        fetch('/api/notif/count').then(function(r) { return r.json(); }).then(function(data) {
            var badge = document.getElementById('notifBadge');
            if (!badge) return;
            if (data.count > 0) {
                badge.textContent = data.count > 99 ? '99+' : data.count;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }).catch(function() {});
    }
    updateNotifCount();
    setInterval(updateNotifCount, 30000);
})();
</script>


<script>
(function() {
    var bell = document.getElementById('notifBellLink');
    if (bell) {
        if (window.location.pathname.indexOf('/admin/') === 0) {
            bell.href = '/admin/notifications';
        } else {
            bell.href = '/notifications';
        }
    }
})();
</script>

</body>
</html>
