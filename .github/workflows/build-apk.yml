name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Install deps
        working-directory: ./mobile
        run: npm install

      - name: Add Android
        working-directory: ./mobile
        run: npx cap add android || true

      - name: Replace app icons
        run: |
          ICON_SRC=static/icons/icon-1024.png
          if [ ! -f "$ICON_SRC" ]; then
            ICON_SRC=static/icons/icon-512.png
          fi
          ANDROID_RES=mobile/android/app/src/main/res
          if [ -d "$ANDROID_RES" ]; then
            for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "$ANDROID_RES/mipmap-$d"
              cp "$ICON_SRC" "$ANDROID_RES/mipmap-$d/ic_launcher.png" 2>/dev/null || true
              cp "$ICON_SRC" "$ANDROID_RES/mipmap-$d/ic_launcher_round.png" 2>/dev/null || true
              cp "$ICON_SRC" "$ANDROID_RES/mipmap-$d/ic_launcher_foreground.png" 2>/dev/null || true
            done
          fi

      - name: Build APK
        working-directory: ./mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dolphin-sms-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
